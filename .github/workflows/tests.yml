name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: api-server
            pom: pom.xml
          - module: mcp-server
            pom: mcp-server/pom.xml
          - module: mcp-client
            pom: mcp-client/pom.xml
          - module: credit-report-mcp-server
            pom: credit-report-mcp-server/pom.xml
          - module: credit-report-mcp-client
            pom: credit-report-mcp-client/pom.xml

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # verify runs the tests and also builds the runnable jar for the MCP modules
      - name: Build and test
        run: ./mvnw -B -ntp -f ${{ matrix.pom }} verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surefire-reports-${{ matrix.module }}
          path: '**/target/surefire-reports/'
          retention-days: 7
