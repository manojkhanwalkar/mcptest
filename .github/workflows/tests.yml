name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: api-server
            pom: pom.xml
          - module: mcp-server
            pom: mcp-server/pom.xml
          - module: mcp-client
            pom: mcp-client/pom.xml

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # verify runs the tests and also builds the runnable jar for the MCP modules
      - name: Build and test
        run: ./mvnw -B -ntp -f ${{ matrix.pom }} verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-${{ matrix.module }}
          path: '**/target/surefire-reports/'
          retention-days: 7
