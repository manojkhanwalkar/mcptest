openapi: 3.0.3
info:
  title: Item API
  version: 1.0.0
  description: |
    Source of truth for the REST API. Edit this file first; the Java
    interfaces and models are generated from it at build time.
# How this file maps to Java (generated by openapi-generator, configured in pom.xml):
#   - each tag            -> an interface in com.example.api.generated.api (tag "items" -> ItemsApi)
#   - each operationId    -> a method on that interface, implemented by a controller
#   - each schema         -> a model class in com.example.api.generated.model
#   - constraints (minLength, pattern, minimum, required, format: email)
#                         -> Bean Validation annotations, enforced automatically (HTTP 400)
# Generated sources land in target/generated-sources/openapi; never edit them by hand.
# To add a new entity, use the /add-endpoint skill, which follows the pattern below.

# Base path for every route. Controllers repeat it in @RequestMapping("/api/v1");
# change both together.
servers:
  - url: /api/v1
tags:
  - name: items
  - name: persons
paths:
  # ---------------------------------------------------------------- Items
  /items:
    get:
      tags: [items]
      operationId: listItems
      summary: List items
      parameters:
        - name: nameContains
          in: query
          required: false
          description: Case-insensitive filter on item name
          schema:
            type: string
      responses:
        '200':
          description: All items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Item'
    post:
      tags: [items]
      operationId: createItem
      summary: Create an item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewItem'
      responses:
        '201':
          description: Item created
          headers:
            Location:
              description: URL of the new item
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '400':
          $ref: '#/components/responses/BadRequest'
  /items/{id}:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    get:
      tags: [items]
      operationId: getItem
      summary: Get an item
      responses:
        '200':
          description: The item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [items]
      operationId: updateItem
      summary: Replace an item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewItem'
      responses:
        '200':
          description: Updated item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [items]
      operationId: deleteItem
      summary: Delete an item
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'
  # ---------------------------------------------------------------- Persons
  /persons:
    get:
      tags: [persons]
      operationId: listPersons
      summary: List persons
      responses:
        '200':
          description: All persons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Person'
    post:
      tags: [persons]
      operationId: createPerson
      summary: Create a person
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPerson'
      responses:
        '201':
          description: Person created
          headers:
            Location:
              description: URL of the new person
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '400':
          $ref: '#/components/responses/BadRequest'
  /persons/{id}:
    parameters:
      - $ref: '#/components/parameters/PersonId'
    get:
      tags: [persons]
      operationId: getPerson
      summary: Get a person
      responses:
        '200':
          description: The person
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [persons]
      operationId: updatePerson
      summary: Replace a person
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPerson'
      responses:
        '200':
          description: Updated person
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [persons]
      operationId: deletePerson
      summary: Delete a person
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'
components:
  # Path parameters. ids are generated server-side and start at 1, so 0 or less is a 400.
  parameters:
    ItemId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    PersonId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  # Each entity has two schemas:
  #   New<Entity>  request body for POST/PUT; carries the validation constraints.
  #   <Entity>     response body; adds the server-assigned id, no input constraints.
  schemas:
    NewItem:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
        price:
          type: number
          format: double
          minimum: 0
    Item:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: double
    NewPerson:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        address:
          type: string
          maxLength: 300
        email:
          type: string
          format: email
          maxLength: 254
        phoneNumber:
          type: string
          description: Digits with optional leading +, spaces, dashes, dots or parentheses
          pattern: '^\+?[0-9 ().-]{7,20}$'
    Person:
      type: object
      required: [id, name, email]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        address:
          type: string
        email:
          type: string
          format: email
        phoneNumber:
          type: string
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
  # Shared error responses; bodies are produced by GlobalExceptionHandler.
  responses:
    BadRequest:
      description: Request failed validation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
