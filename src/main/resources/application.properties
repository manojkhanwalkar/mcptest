spring.application.name=api-server

# HTTP port. Override at runtime with --server.port=9090 or the SERVER_PORT env var.
server.port=8080

# Listen on loopback only. The API has no authentication and stores personal data (names,
# emails, addresses, phone numbers), so it must not be reachable from other machines by default.
# To expose it, put it behind an authenticating proxy and set SERVER_ADDRESS (e.g. 0.0.0.0).
server.address=127.0.0.1

# Reject request bodies larger than this (413). The largest valid body is about 1 KB.
api.max-request-body-bytes=65536

# Expose only the health endpoint from actuator (GET /actuator/health)
management.endpoints.web.exposure.include=health

# Return RFC 9457 problem+json bodies for errors
spring.mvc.problemdetails.enabled=true
